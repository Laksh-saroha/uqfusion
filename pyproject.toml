[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "uqfusion"
version = "0.0.1"
description = "Uncertainty-aware visible-infrared fusion for maritime object detection (UG research fellowship, TIET)"
requires-python = ">=3.10"
# Runtime dependencies are managed exclusively via the pinned requirements.txt
# (single source of truth for reproducibility); this package declares none.

[tool.setuptools.packages.find]
where = ["src"]
