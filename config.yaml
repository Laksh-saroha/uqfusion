# =============================================================================
# uqfusion — single configuration file for ALL machines.
#
# Moving to a new machine (e.g. the GPU Jupyter server):
#   1. Edit the `paths:` block below (and `device:` if needed).
#   2. Nothing else should need to change.
#
# Relative paths are resolved against this file's directory.
# Entries marked PENDING are finalized per progress.md open questions / the
# Phase 1 timing dry-run; do not treat them as settled.
# =============================================================================

paths:
  data_root: data              # expected dataset layout: README.md
  outputs_root: runs           # all training/eval outputs
  cache_root: runs/cache       # cached predictions for gate ablations (plan B5-2)

datasets:
  pohang:
    root: "{data_root}/pohang"
    vis_yaml: "{data_root}/pohang/data_vis.yaml"   # per-modality YOLO format (scope §5.1)
    ir_yaml: "{data_root}/pohang/data_ir.yaml"
  mit_marine:                  # onboarded Phase 2+ (plan C4); yamls filled then
    root: "{data_root}/mit_marine"
    vis_yaml: null
    ir_yaml: null

device: auto                   # auto | cpu | "0" | "0,1"

# --- Phase 1: backbone benchmark (plan C5) ----------------------------------
benchmark:
  variants: [yolov8s, yolov9s, yolov10s, yolo11s, yolo12s, yolo26s]   # plan C2
  seeds: [0, 1, 2]
  imgsz: 640
  epochs: 100                  # standard fine-tuning default; tweak after first server runs if needed
  patience: 20
  batch: 32                    # sized for the H100; drop if any variant OOMs (largest-common-fit rule)
  optimizer: auto              # uniform rule: per-model tooling default, disclosed (plan C5)
  pretrained: true             # all rows fine-tune from official COCO weights (identical rule)
  train_stride: 2              # approved A2-6; applies to TRAINING frames only
  deterministic: true
  amp: true
  workers: 8
  fps_frames: 500              # FPS protocol (plan C5)
  fps_warmup: 50

# --- Split audit (Phase 1; plan B6-2 / decision D6-rev) ----------------------
data_audit:
  min_gap_frames: 100          # ~10 s at 10 Hz: min temporal gap between train and val/test frames of the same run

# --- Gaussian σ² head, O2 (scope §6.2; plan B1; decisions D1) ----------------
gaussian:
  beta: 0.5                    # β-NLL exponent (R10); 0 = plain NLL
  nll_gain: 1.0                # weight of the NLL term in the summed loss
  warmup_epochs: 5             # μ trains alone first; σ frozen via zero NLL weight (R11)
  ramp_epochs: 5               # linear NLL-weight ramp after warm-up
  sigma_detach_features: true  # σ branch reads detached neck features (baseline-identical detector grads)
  nll_detach_mu: true          # NLL trains σ only; μ stays owned by DFL/CIoU (D1 attribution guarantee)

# --- Phase 3 baselines (scope §9.2; plan B6-3/B6-7) --------------------------
baselines:
  mc_dropout:
    p: 0.15                    # Dropout2d before each head branch's final conv (pre-fixed, B6-3)
    T: 10                      # stochastic passes at inference
  ensemble:
    seeds: [0, 1, 2, 3, 4]     # M=5; members ARE the seed replicates (B6-7)

# --- Tiny-subset smoke paths (mandatory for every trainable component) ------
smoke:
  variant: yolov8n             # smallest model — smoke tests exercise plumbing, not quality
  n_images: 32
  epochs: 2
  imgsz: 320
  batch: 4
  gaussian_epochs: 10          # smoke_gaussian: 2 warm-up + 2 ramp + 6 active NLL epochs
  hetero_images: 48

# --- Reliability score, scope §6.4 (plan B5: constants are FIT ON VALIDATION,
#     via pre-registered rules — never hand-set). Rules resolve to numbers in
#     Phase 2/3 and the resolved values get committed alongside the fit code.
reliability:
  lambda_rule: "r_box = 0.9 at clean-val median U_box"
  mahalanobis_mu_rule: "95th percentile of clean-val Mahalanobis distances"
  mahalanobis_tau_rule: "scaled from clean-val IQR"
  combination: multiplicative  # ablate vs min / weighted-geometric (plan B5-3)
  alpha: 1.0                   # temporal smoothing OFF — per-frame headline protocol (decision D14)

tracking:
  backend: tensorboard         # local default, no account needed; wandb optional (scope §11.2)
  project: uqfusion
